<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Massive Stock Watchlist</title>
  <style>
    :root {
      --bg: #f4f6fa;
      --surface: #ffffff;
      --border: #e3e8ef;
      --text: #1c2333;
      --muted: #64748b;
      --accent: #ff3621;
      --accent-hover: #e02b18;
      --accent-soft: #fff1ef;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(28, 35, 51, 0.08), 0 8px 24px rgba(28, 35, 51, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 720px;
      margin: 48px auto;
      padding: 0 20px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    header { margin-bottom: 28px; }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      flex-shrink: 0;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .subtitle { color: var(--muted); margin: 6px 0 0; font-size: 15px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 24px;
    }

    label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }

    .input-row { display: flex; gap: 12px; }

    input[type="text"] {
      flex: 1;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      background: #fbfcfe;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      background: #fff;
    }

    button {
      padding: 11px 22px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, transform 0.05s;
    }

    button:hover { background: var(--accent-hover); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    #result {
      margin-top: 16px;
      white-space: pre-wrap;
      background: var(--accent-soft);
      border: 1px solid #ffd6d0;
      padding: 10px 14px;
      border-radius: 8px;
      min-height: 20px;
      font-size: 14px;
    }

    #result:empty { display: none; }

    .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14.5px;
    }

    th {
      text-align: left;
      padding: 10px 12px;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 2px solid var(--border);
    }

    td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background 0.1s; }
    tbody tr:hover { background: #f8fafc; }

    td:first-child { font-weight: 700; }

    @media (max-width: 560px) {
      .input-row { flex-direction: column; }
      body { margin: 24px auto; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-row">
      <div class="logo-mark">S</div>
      <div>
        <h1>Stock Watchlist</h1>
        <p class="subtitle">Powered by Lakebase + Massive</p>
      </div>
    </div>
  </header>

  <div class="card">
    <form id="stock-form">
      <label for="symbol">Ticker symbol</label>
      <div class="input-row">
        <input type="text" id="symbol" name="symbol" placeholder="e.g. AAPL" required>
        <button type="submit">Add to watchlist</button>
      </div>
      <p class="hint">Enter a single ticker symbol. This sends exactly ONE call to the Massive API to fetch the latest price, then adds it to your watchlist.</p>
    </form>

    <div id="result"></div>
  </div>

  <div class="card">
  <table id="watchlist-table">
    <thead>
      <tr>
        <th>Symbol</th>
        <th>Email</th>
        <th>Latest price</th>
        <th>Updated</th>
      </tr>
    </thead>
    <tbody id="watchlist-body"></tbody>
  </table>
  </div>

  <script>
    const form = document.getElementById("stock-form");
    const resultEl = document.getElementById("result");
    const watchlistBody = document.getElementById("watchlist-body");

    async function loadWatchlist() {
      try {
        const resp = await fetch("/watchlist");
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error loading watchlist: " + (data.error || resp.statusText);
          return;
        }
        watchlistBody.innerHTML = "";
        data.forEach((row) => {
          const tr = document.createElement("tr");
          const price = row.latest_price !== null && row.latest_price !== undefined
            ? Number(row.latest_price).toFixed(2)
            : "-";
          const updated = row.updated_at ? new Date(row.updated_at).toLocaleString() : "-";
          tr.innerHTML = `<td>${row.symbol}</td><td>${row.email || "-"}</td><td>${price}</td><td>${updated}</td>`;
          watchlistBody.appendChild(tr);
        });
      } catch (err) {
        resultEl.textContent = "Failed to load watchlist: " + err;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const symbol = document.getElementById("symbol").value;
      resultEl.textContent = "Adding to watchlist...";

      try {
        const resp = await fetch("/watchlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error: " + (data.error || resp.statusText);
          return;
        }
        resultEl.textContent = "Added " + data.symbol + " at price " + data.latest_price;
        document.getElementById("symbol").value = "";
        loadWatchlist();
      } catch (err) {
        resultEl.textContent = "Request failed: " + err;
      }
    });

    loadWatchlist();
  </script>
</body>
</html>
